<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBS Silo Monitoring System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #010a0f;
    --bg-mid: #021520;
    --bg-card: #041e2e;
    --accent-cyan: #00e5ff;
    --accent-gold: #ffc107;
    --accent-amber: #ff8f00;
    --accent-green: #00e676;
    --accent-red: #ff1744;
    --text-primary: #e0f7fa;
    --text-dim: #546e7a;
    --border-glow: rgba(0,229,255,0.3);
    --fill-high: #ffc107;
    --fill-dark: #6d4c00;
    --grid-line: rgba(0,229,255,0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 8s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  .header {
    position: relative;
    z-index: 10;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-glow);
    background: linear-gradient(180deg, rgba(0,229,255,0.04) 0%, transparent 100%);
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    border: 2px solid var(--accent-cyan);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: logoPulse 3s ease-in-out infinite;
  }

  .logo-icon::before {
    content: '';
    position: absolute;
    inset: -4px;
    border: 1px solid var(--accent-cyan);
    border-radius: 10px;
    opacity: 0.4;
    animation: logoPulse 3s ease-in-out infinite reverse;
  }

  @keyframes logoPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(0,229,255,0.3); }
    50% { box-shadow: 0 0 25px rgba(0,229,255,0.8), 0 0 50px rgba(0,229,255,0.2); }
  }

  .logo-svg { width: 24px; height: 24px; fill: var(--accent-cyan); }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--accent-cyan);
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .header-sub {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .header-stats {
    display: flex;
    gap: 40px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-gold);
    text-shadow: 0 0 15px rgba(255,193,7,0.5);
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .header-time {
    text-align: right;
  }

  .time-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    color: var(--accent-cyan);
    letter-spacing: 3px;
  }

  .date-display {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
  }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    justify-content: flex-end;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    animation: liveBlink 1.5s ease-in-out infinite;
    box-shadow: 0 0 10px var(--accent-green);
  }

  @keyframes liveBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }

  .live-text {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent-green);
  }

  .dashboard {
    position: relative;
    z-index: 1;
    padding: 30px 30px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
  }

  .silo-card {
    background: var(--bg-card);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 12px;
    padding: 16px 12px 12px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
    cursor: default;
    animation: cardReveal 0.6s ease both;
  }

  .silo-card:hover {
    border-color: rgba(0,229,255,0.5);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,229,255,0.1), 0 0 0 1px rgba(0,229,255,0.2);
  }

  .silo-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .silo-card:hover::before { opacity: 1; }

  /* Corner decorations */
  .silo-card::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 20px; height: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.3);
    border-right: 1px solid rgba(0,229,255,0.3);
    border-radius: 0 0 12px 0;
  }

  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .silo-id {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent-cyan);
    text-align: center;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(0,229,255,0.5);
  }

  /* SILO BODY */
  .silo-visual {
    position: relative;
    width: 100%;
    height: 160px;
    margin: 0 auto 12px;
    max-width: 120px;
    display: block;
  }

  .silo-svg-wrap {
    width: 100%;
    height: 100%;
  }

  /* DATA TABLE */
  .silo-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9.5px;
  }

  .silo-table th {
    color: var(--text-dim);
    letter-spacing: 1.5px;
    font-size: 8px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(0,229,255,0.1);
    text-align: left;
  }

  .silo-table td {
    padding: 5px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--text-primary);
    font-size: 9px;
  }

  .silo-table td:last-child {
    text-align: right;
    color: var(--accent-gold);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
  }

  .silo-table tr:last-child td { border-bottom: none; }

  /* EMPTY STATE */
  .empty-val { color: var(--text-dim) !important; }

  /* Status badge */
  .status-badge {
    position: absolute;
    top: 10px; right: 10px;
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .status-active {
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
    animation: liveBlink 2s ease-in-out infinite;
  }

  .status-empty {
    background: var(--text-dim);
  }

  .status-alert {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
    animation: liveBlink 0.8s ease-in-out infinite;
  }

  /* HORIZONTAL SEPARATOR */
  .section-divider {
    grid-column: 1 / -1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
    margin: 4px 0;
    display: none;
  }

  /* BOTTOM BAR */
  .footer {
    position: relative;
    z-index: 10;
    padding: 14px 40px;
    border-top: 1px solid var(--border-glow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    background: linear-gradient(0deg, rgba(0,229,255,0.03) 0%, transparent 100%);
  }

  .footer-ticker {
    flex: 1;
    overflow: hidden;
    margin: 0 40px;
  }

  .ticker-inner {
    display: inline-block;
    white-space: nowrap;
    animation: ticker 30s linear infinite;
    color: rgba(0,229,255,0.5);
  }

  @keyframes ticker {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
  }

  /* Total bar */
  .total-bar {
    position: relative;
    z-index: 10;
    padding: 10px 30px;
    display: flex;
    gap: 20px;
    align-items: center;
    background: rgba(0,229,255,0.03);
    border-bottom: 1px solid rgba(0,229,255,0.1);
    flex-wrap: wrap;
  }

  .total-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  .total-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-gold);
    text-shadow: 0 0 10px rgba(255,193,7,0.4);
  }

  .total-sep {
    width: 1px;
    height: 24px;
    background: rgba(0,229,255,0.2);
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">
    <div class="logo-icon">
      <svg class="logo-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <div>
      <div class="header-title">FBS SILO MONITOR</div>
      <div class="header-sub">FOOD & BEVERAGE STORAGE · REAL-TIME TELEMETRY</div>
    </div>
  </div>

  <div class="header-stats">
    <div class="stat-item">
      <div class="stat-value" id="totalSilos">12</div>
      <div class="stat-label">TOTAL SILOS</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="activeSilos">10</div>
      <div class="stat-label">ACTIVE</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="totalStock">—</div>
      <div class="stat-label">TOTAL MT</div>
    </div>
  </div>

  <div class="header-time">
    <div class="time-display" id="clock">00:00:00</div>
    <div class="date-display" id="dateDisplay">—</div>
    <div class="live-indicator">
      <div class="live-dot"></div>
      <div class="live-text">LIVE</div>
    </div>
  </div>
</header>

<!-- TOTAL BAR -->
<div class="total-bar">
  <span class="total-label">SYSTEM STATUS</span>
  <div class="total-sep"></div>
  <span class="total-label">BR-34 PADDY</span>
  <span class="total-value" id="br34total">—</span>
  <div class="total-sep"></div>
  <span class="total-label">KATARI PADDY</span>
  <span class="total-value" id="kataritotal">—</span>
  <div class="total-sep"></div>
  <span class="total-label">SOMA-5 PADDY</span>
  <span class="total-value" id="soma5total">—</span>
  <div class="total-sep"></div>
  <span class="total-label">MINIKET PADDY</span>
  <span class="total-value" id="minikettotal">—</span>
  <div class="total-sep"></div>
  <span class="total-label">LAST SYNC</span>
  <span class="total-value" id="lastSync" style="font-size:11px;color:var(--accent-cyan);">—</span>
</div>

<!-- DASHBOARD GRID -->
<main class="dashboard" id="dashboard"></main>

<!-- FOOTER -->
<footer class="footer">
  <span>FBS-MONITOR v3.1.0</span>
  <div class="footer-ticker">
    <span class="ticker-inner" id="ticker">LOADING SYSTEM DATA...</span>
  </div>
  <span>SECURE CHANNEL · AES-256</span>
</footer>

<script>
// =============================================
// SILO DATA
// =============================================
const SILO_DATA = [
  {
    id: 'FBS-01', fillPct: 94.71,
    stocks: [{ name: 'BR-34 Paddy', mt: 3315 }],
    status: 'active'
  },
  {
    id: 'FBS-02', fillPct: 12.71,
    stocks: [
      { name: 'Katari Paddy', mt: 444.82 },
      { name: 'Shubolota P...', mt: 118 }
    ],
    status: 'active',
    layers: [{ pct: 12.71, color: '#6d4c00' }, { pct: 3.37, color: '#6d4c00' }]
  },
  {
    id: 'FBS-03', fillPct: 12.3,
    stocks: [{ name: 'Katari Paddy', mt: 430.5 }],
    status: 'active'
  },
  {
    id: 'FBS-07', fillPct: 100.6,
    stocks: [{ name: 'Soma-5 Paddy', mt: 3521 }],
    status: 'alert'
  },
  {
    id: 'FBS-08', fillPct: 94.29,
    stocks: [{ name: 'Soma-5 Paddy', mt: 3300 }],
    status: 'active'
  },
  {
    id: 'FBS-09', fillPct: 0,
    stocks: [{ name: '—', mt: 0 }],
    status: 'empty'
  },
  {
    id: 'FBS-04', fillPct: 37.63,
    stocks: [{ name: 'Miniket Paddy', mt: 1317 }],
    status: 'active'
  },
  {
    id: 'FBS-05', fillPct: 74.65,
    stocks: [{ name: 'Miniket Paddy', mt: 2612.7 }],
    status: 'active',
    darkFill: true
  },
  {
    id: 'FBS-06', fillPct: 0,
    stocks: [{ name: '—', mt: 0 }],
    status: 'empty'
  },
  {
    id: 'FBS-10', fillPct: 87.63,
    stocks: [{ name: 'Miniket Paddy', mt: 3067 }],
    status: 'active'
  },
  {
    id: 'FBS-11', fillPct: 61.26,
    stocks: [
      { name: 'Rod Miniket...', mt: 2144 },
      { name: 'Miniket Paddy', mt: 1056 }
    ],
    status: 'active',
    layers: [{ pct: 61.26, color: '#ffc107' }, { pct: 30.17, color: '#ffc107' }]
  },
  {
    id: 'FBS-12', fillPct: 20,
    stocks: [{ name: 'BR-34 Paddy', mt: 899.36 }],
    status: 'active',
    darkFill: true
  }
];

// =============================================
// LIVE FLUCTUATION
// =============================================
// Each silo gets a live fluctuation offset
const liveOffsets = SILO_DATA.map(() => 0);
const liveFluctuation = SILO_DATA.map(() => ({ dir: 1, speed: Math.random() * 0.08 + 0.01 }));

function updateLiveData() {
  SILO_DATA.forEach((silo, i) => {
    if (silo.fillPct === 0) return;
    const f = liveFluctuation[i];
    liveOffsets[i] += f.dir * f.speed;
    if (Math.abs(liveOffsets[i]) > 1.2) {
      f.dir *= -1;
      f.speed = Math.random() * 0.08 + 0.01;
    }
    // Tiny stock fluctuation
    silo.stocks.forEach(s => {
      if (s.mt > 0) {
        s._display = s.mt + (liveOffsets[i] * (s.mt * 0.0003));
      }
    });
  });
}

// =============================================
// RENDER SILO SVG
// =============================================
function buildSiloSVG(silo, liveOffset) {
  const pct = Math.min(silo.fillPct + liveOffset, 100);
  const isEmpty = silo.fillPct === 0;
  const isAlert = silo.status === 'alert';
  const isDark = silo.darkFill;

  const W = 100, H = 160;
  const bodyX = 12, bodyW = W - 24;
  const roofH = 28, bodyH = H - roofH - 18, baseH = 18;
  const bodyY = roofH;
  const bodyBottom = bodyY + bodyH;

  const fillH = bodyH * (Math.min(pct, 100) / 100);
  const fillY = bodyBottom - fillH;

  const fillColor = isAlert ? '#ff6b35' : (isDark ? '#8d6e00' : '#ffc107');
  const fillGlow = isAlert ? 'rgba(255,107,53,0.4)' : 'rgba(255,193,7,0.3)';

  let fillSVG = '';
  if (!isEmpty && pct > 0) {
    fillSVG = `
      <defs>
        <clipPath id="clip-${silo.id}">
          <rect x="${bodyX}" y="${bodyY}" width="${bodyW}" height="${bodyH}" rx="4"/>
        </clipPath>
        <linearGradient id="fillGrad-${silo.id}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${fillColor}" stop-opacity="0.7"/>
          <stop offset="40%" stop-color="${fillColor}"/>
          <stop offset="100%" stop-color="${fillColor}" stop-opacity="0.75"/>
        </linearGradient>
        <filter id="glow-${silo.id}">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- Fill body -->
      <rect x="${bodyX}" y="${fillY}" width="${bodyW}" height="${fillH}"
            fill="url(#fillGrad-${silo.id})"
            clip-path="url(#clip-${silo.id})"
            rx="3"/>

      <!-- Surface shimmer line -->
      <line x1="${bodyX+2}" y1="${fillY}" x2="${bodyX+bodyW-2}" y2="${fillY}"
            stroke="rgba(255,255,255,0.6)" stroke-width="1.5"
            clip-path="url(#clip-${silo.id})"/>

      <!-- Glow at top of fill -->
      <rect x="${bodyX}" y="${fillY - 4}" width="${bodyW}" height="8"
            fill="${fillGlow}"
            clip-path="url(#clip-${silo.id})"
            rx="2"/>

      <!-- Percentage label -->
      <text x="${W/2}" y="${fillY + Math.max(fillH/2, 12)}"
            text-anchor="middle" dominant-baseline="middle"
            font-family="Orbitron,monospace" font-size="9" font-weight="700"
            fill="rgba(255,255,255,0.9)"
            filter="url(#glow-${silo.id})">
        ${pct.toFixed(1)}%
      </text>
    `;
  }

  // Animated wave at fill surface
  let waveSVG = '';
  if (!isEmpty && pct > 2) {
    waveSVG = `
      <g clip-path="url(#clip-${silo.id})">
        <rect x="${bodyX}" y="${fillY - 3}" width="${bodyW}" height="6"
              fill="${fillColor}" opacity="0.5">
          <animate attributeName="y" values="${fillY-3};${fillY-5};${fillY-3}"
                   dur="2.${silo.id.slice(-2)}s" repeatCount="indefinite"/>
        </rect>
      </g>
    `;
  }

  // Empty glow
  let emptyGlow = '';
  if (isEmpty) {
    emptyGlow = `
      <text x="${W/2}" y="${bodyY + bodyH/2}"
            text-anchor="middle" dominant-baseline="middle"
            font-family="Orbitron,monospace" font-size="8"
            fill="rgba(84,110,122,0.8)">0%</text>
    `;
  }

  return `
  <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="bodyGrad-${silo.id}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="rgba(0,229,255,0.08)"/>
        <stop offset="50%" stop-color="rgba(0,229,255,0.03)"/>
        <stop offset="100%" stop-color="rgba(0,229,255,0.08)"/>
      </linearGradient>
      <linearGradient id="roofGrad-${silo.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a3a4a"/>
        <stop offset="100%" stop-color="#0d2535"/>
      </linearGradient>
    </defs>

    <!-- Silo body background -->
    <rect x="${bodyX}" y="${bodyY}" width="${bodyW}" height="${bodyH}"
          fill="url(#bodyGrad-${silo.id})" rx="4"
          stroke="rgba(0,229,255,0.25)" stroke-width="1"/>

    <!-- Fill content -->
    ${fillSVG}
    ${waveSVG}
    ${emptyGlow}

    <!-- Roof (cone/trapezoid) -->
    <polygon points="${W/2},2 ${W-4},${roofH} ${4},${roofH}"
             fill="url(#roofGrad-${silo.id})"
             stroke="rgba(0,229,255,0.4)" stroke-width="1.2"/>

    <!-- Roof center vent line -->
    <line x1="${W/2}" y1="2" x2="${W/2}" y2="${roofH}"
          stroke="rgba(0,229,255,0.3)" stroke-width="0.8"/>
    <line x1="${W*0.35}" y1="${roofH*0.6}" x2="${W*0.65}" y2="${roofH*0.6}"
          stroke="rgba(0,229,255,0.2)" stroke-width="0.8"/>

    <!-- Roof top knob -->
    <circle cx="${W/2}" cy="3" r="3"
            fill="#1a3a4a" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>

    <!-- Silo body side lines (detail) -->
    <line x1="${bodyX+bodyW*0.25}" y1="${bodyY+2}" x2="${bodyX+bodyW*0.25}" y2="${bodyBottom-2}"
          stroke="rgba(0,229,255,0.12)" stroke-width="0.8"/>
    <line x1="${bodyX+bodyW*0.75}" y1="${bodyY+2}" x2="${bodyX+bodyW*0.75}" y2="${bodyBottom-2}"
          stroke="rgba(0,229,255,0.12)" stroke-width="0.8"/>

    <!-- Base platform -->
    <rect x="${bodyX - 6}" y="${bodyBottom}" width="${bodyW + 12}" height="${baseH}"
          rx="4" fill="#0d2535" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
    <rect x="${bodyX}" y="${bodyBottom + 3}" width="${bodyW}" height="3"
          rx="1" fill="rgba(0,229,255,0.15)"/>

    <!-- Alert overlay flash -->
    ${isAlert ? `
    <rect x="${bodyX}" y="${bodyY}" width="${bodyW}" height="${bodyH}"
          fill="rgba(255,100,50,0.07)" rx="4">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite"/>
    </rect>` : ''}
  </svg>`;
}

// =============================================
// BUILD CARDS
// =============================================
function buildCard(silo, idx) {
  const card = document.createElement('div');
  card.className = 'silo-card';
  card.id = `card-${silo.id}`;
  card.style.animationDelay = `${idx * 0.07}s`;

  const statusClass = silo.status === 'active' ? 'status-active'
    : silo.status === 'alert' ? 'status-alert' : 'status-empty';

  const tableRows = silo.stocks.map(s => {
    const isEmpty = s.mt === 0;
    return `<tr>
      <td class="${isEmpty ? 'empty-val' : ''}">${s.name}</td>
      <td class="${isEmpty ? 'empty-val' : ''}">${isEmpty ? '0' : s.mt.toFixed ? s.mt.toFixed(2) : s.mt}</td>
    </tr>`;
  }).join('');

  card.innerHTML = `
    <div class="status-badge ${statusClass}"></div>
    <div class="silo-id">${silo.id}</div>
    <div class="silo-visual" id="vis-${silo.id}">
      ${buildSiloSVG(silo, 0)}
    </div>
    <table class="silo-table">
      <thead>
        <tr>
          <th>PADDY NAME</th>
          <th style="text-align:right">STOCK (MT)</th>
        </tr>
      </thead>
      <tbody id="tbody-${silo.id}">
        ${tableRows}
      </tbody>
    </table>`;

  return card;
}

// =============================================
// INIT & UPDATE LOOP
// =============================================
function init() {
  const grid = document.getElementById('dashboard');
  SILO_DATA.forEach((silo, i) => {
    grid.appendChild(buildCard(silo, i));
  });

  // Compute totals
  let totals = { 'BR-34 Paddy': 0, 'Katari Paddy': 0, 'Soma-5 Paddy': 0, 'Miniket Paddy': 0 };
  let grandTotal = 0;
  SILO_DATA.forEach(silo => {
    silo.stocks.forEach(s => {
      grandTotal += s.mt;
      for (const k in totals) {
        if (s.name.includes(k.split(' ')[0])) totals[k] += s.mt;
      }
    });
  });

  document.getElementById('totalStock').textContent = (grandTotal/1000).toFixed(2) + 'K';
  document.getElementById('br34total').textContent = totals['BR-34 Paddy'].toFixed(2) + ' MT';
  document.getElementById('kataritotal').textContent = totals['Katari Paddy'].toFixed(2) + ' MT';
  document.getElementById('soma5total').textContent = totals['Soma-5 Paddy'].toFixed(2) + ' MT';
  document.getElementById('minikettotal').textContent = totals['Miniket Paddy'].toFixed(2) + ' MT';

  // Ticker
  const tickerItems = SILO_DATA.map(s =>
    `${s.id}: ${s.stocks.map(st => `${st.name} ${st.mt > 0 ? st.mt + 'MT' : 'EMPTY'}`).join(' | ')}`
  ).join('  ◈  ');
  document.getElementById('ticker').textContent = tickerItems;

  updateLoop();
}

let frame = 0;
function updateLoop() {
  frame++;
  updateLiveData();

  // Every ~60 frames update SVGs (avoid DOM thrash every frame)
  if (frame % 20 === 0) {
    SILO_DATA.forEach((silo, i) => {
      const vis = document.getElementById(`vis-${silo.id}`);
      if (vis) vis.innerHTML = buildSiloSVG(silo, liveOffsets[i]);

      // Update table numbers
      const tbody = document.getElementById(`tbody-${silo.id}`);
      if (tbody) {
        tbody.innerHTML = silo.stocks.map(s => {
          const val = s._display !== undefined ? s._display : s.mt;
          const isEmpty = s.mt === 0;
          return `<tr>
            <td class="${isEmpty ? 'empty-val' : ''}">${s.name}</td>
            <td class="${isEmpty ? 'empty-val' : ''}">${isEmpty ? '0' : val.toFixed(2)}</td>
          </tr>`;
        }).join('');
      }
    });

    // Update last sync
    const now = new Date();
    document.getElementById('lastSync').textContent =
      now.toLocaleTimeString('en-US', { hour12: false });
  }

  requestAnimationFrame(updateLoop);
}

// CLOCK
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', { hour12: false });
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }).toUpperCase();
}
setInterval(updateClock, 1000);
updateClock();

init();
</script>
</body>
</html>
